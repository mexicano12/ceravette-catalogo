<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Admin - CeraVette</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-stone-100 h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl border border-stone-200 overflow-hidden">
        <div class="bg-stone-900 p-6 text-center">
            <div class="w-12 h-12 bg-amber-500 rounded-full flex items-center justify-center mx-auto mb-3">
                <i data-lucide="lock" class="text-stone-900 w-6 h-6"></i>
            </div>
            <h1 class="text-white font-bold text-lg">Control Desk</h1>
            <p class="text-stone-400 text-xs font-mono uppercase tracking-widest">Acceso Restringido</p>
        </div>

        <form method="POST" class="p-6 space-y-4">
            <div>
                <label class="block text-xs font-mono text-stone-500 mb-1">USUARIO</label>
                <input type="text" name="username" required 
                       class="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 outline-none">
            </div>
            <div>
                <label class="block text-xs font-mono text-stone-500 mb-1">CONTRASEÑA</label>
                <input type="password" name="password" required 
                       class="w-full px-3 py-2 border border-stone-200 rounded-lg text-sm focus:ring-2 focus:ring-amber-500 outline-none">
            </div>
            <button type="submit" 
                    class="w-full bg-stone-900 hover:bg-stone-800 text-white py-2.5 rounded-lg text-sm font-medium transition-all shadow-md mt-2">
                Iniciar Sesión
            </button>
        </form>
    </div>

    <script>
        lucide.createIcons();
    </script>
   
</body>
</html>
