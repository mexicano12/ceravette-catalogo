<!DOCTYPE html>
<html lang="es">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Editar Producto</title>
</head>
<body class="bg-stone-50 p-8">
    <div class="max-w-xl mx-auto bg-white p-8 rounded-3xl shadow-lg border border-stone-100">
        <h2 class="text-2xl font-bold mb-6">Editar Producto: {{ producto.nombre }}</h2>
        
        <form action="/admin/editar/{{ producto.id }}" method="POST">
            <div class="mb-4">
                <label class="block text-sm font-bold mb-2">Nombre Comercial</label>
                <input type="text" name="nombre" value="{{ producto.nombre }}" class="w-full p-3 border rounded-xl" required>
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-bold mb-2">Precio ($ MXN)</label>
                <input type="number" step="0.01" name="precio" value="{{ producto.precio }}" class="w-full p-3 border rounded-xl" required>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-bold mb-2">Descripción</label>
                <textarea name="descripcion" class="w-full p-3 border rounded-xl h-32">{{ producto.descripcion }}</textarea>
            </div>

            <div class="flex gap-4">
                <button type="submit" class="bg-emerald-600 text-white px-6 py-3 rounded-xl hover:bg-emerald-700">Guardar Cambios</button>
                <a href="/admin" class="bg-stone-200 px-6 py-3 rounded-xl hover:bg-stone-300">Cancelar</a>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-bold mb-2">Categoría</label>
                <select name="categoria" class="w-full p-3 border rounded-xl bg-white">
                    {% for cat in categorias %}
                        <option value="{{ cat.id }}" {% if cat.id == producto.categoria %}selected{% endif %}>
                            {{ cat.nombre }}
                        </option>
                    {% endfor %}
                </select>
            </div>
        </form>
    </div>
</body>
</html>
